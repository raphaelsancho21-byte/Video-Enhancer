name: Check
on:
  push:
  pull_request:
jobs:
  syntax-and-render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Python syntax
        run: python -m compileall -q app.py beat_detection.py tiktok_integration.py motion_blur.py video_layers.py tests
      - name: JavaScript syntax
        run: |
          for file in static/*.js static/v2/*.js; do node --check "$file"; done\n          node --test tests/test_v2_timeline.cjs
      - name: Setup dependencies
        run: |
          pip install -r requirements.txt
          ffmpeg -version
      - name: FFmpeg export smoke test
        run: python tests/test_smoke.py
